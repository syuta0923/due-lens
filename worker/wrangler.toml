name = "syllabus-calendar-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

# 無料枠のカウント（6.3）と簡易レート制限に使う
# 作成: npx wrangler kv namespace create QUOTA
[[kv_namespaces]]
binding = "QUOTA"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "PUT_YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"

# wrangler dev は既定で 127.0.0.1 にしか開かず、エミュレータや実機から LAN アドレス
# （app.json の apiBaseUrl）で届かない。デモ動画も LAN 経由で撮るので全インターフェースで待つ
[dev]
ip = "0.0.0.0"
port = 8787

[vars]
# モデルは 4.7 の eval で確定させる。差し替えはこの 1 行。
# gpt-4o-mini は 9/24 の eval で候補から外した（書類に無い日付を作る・画像のトークンが約 11 倍）
# プロバイダはモデル ID から自動で決まる（gemini-* は Google、それ以外は OpenAI）
MODEL = "gpt-4.1-mini"
# 開発中は緩めてよい。本番は 6 程度（6.3 の防衛線）
RATE_LIMIT_PER_MINUTE = "6"

# シークレット（wrangler secret put OPENAI_API_KEY）
# ローカル開発は worker/.dev.vars に書く
